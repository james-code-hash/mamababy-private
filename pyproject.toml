[project]
name = "mamababy-private"
version = "0.1.0"
description = "James 的 MoneyERP 私人附加套件：帕帕貝貝家（每週 Reel）"
requires-python = ">=3.13"
dependencies = []  # 執行時用主程式 money-erp-v2 的環境（moneyerp.* 已裝好）

[project.entry-points."moneyerp.cli"]
papa = "mamababy_private.cli:register"

[project.entry-points."moneyerp.series"]
papa_home = "mamababy_private.series:PapaSeries"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mamababy_private"]

[tool.pytest.ini_options]
testpaths = ["tests"]
