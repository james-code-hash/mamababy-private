# 把 money-erp-v2 的後台網頁部署到 Firebase Hosting，部署到 James 的 Firebase 專案。只能手動觸發。
# 切換到 v2 之前不要跑：現在的後台與規則還是 mamababy-tools 部署的。
name: Deploy erp-web

on:
  workflow_dispatch:
    inputs:
      v2_ref:
        description: money-erp-v2 的分支或 commit（跟 claw 跑的映像檔同一版）
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","claw-arm-1"]') }}
    environment: production
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: shopee-bank/money-erp-v2
          ref: ${{ inputs.v2_ref }}
          token: ${{ secrets.V2_READ_TOKEN || github.token }}
          path: v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Resolve Firebase project
        # repo variable FIREBASE_PROJECT_ID, else project_id from the service-account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          project="${PROJECT_VAR:-$(node -e 'try{process.stdout.write(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}").project_id||"")}catch(e){}')}"
          if [ -z "$project" ]; then
            echo "::error::Set repo variable FIREBASE_PROJECT_ID or secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          echo "FIREBASE_PROJECT=$project" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=$project" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=$project.firebaseapp.com" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: v2
      - run: npx nx run erp-web:build --outputStyle=static
        working-directory: v2
      - name: firebase deploy --only hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds="$RUNNER_TEMP/firebase-sa.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          trap 'rm -f "$creds"' EXIT
          cd v2/apps/erp-web
          GOOGLE_APPLICATION_CREDENTIALS="$creds" npx firebase deploy --only hosting --project "$FIREBASE_PROJECT" --config firebase.json --non-interactive
